<html>
<head>
    <title>Homework Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button onclick="toggleDarkMode()">Dark Mode</button>

    <div class="container">
        <h1>Homework Planner</h1>
        <p>Use this planner to keep track of your homework assignments and due dates.</p>

        <a href="calendar.html">Go to Assignment Calendar</a>

        <div class="form-box">
            <form id="task-form">
                <input type="text" id="task-input" placeholder="Enter homework assignment..." required>
                <input type="date" id="due-date" required>
                <button type="submit">Add Task</button>
            </form>
        </div>

        <div class="task-list">
            <h2>Task List</h2>
            <ul id="tasks"></ul>
        </div>
    </div>
<img src="https://cdn-icons-png.flaticon.com/512/2995/2995467.png" class="boy" alt="boy">
<img src="https://cdn-icons-png.flaticon.com/512/1250/1250615.png" class="floating pen" alt="Pen">

    <script src="script.js"></script>
</body>
</html>
